<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picture Market</title>
<meta name="description" content="A layered photo editor that runs in the browser: selections, masks, adjustments, filters, type and print-ready export.">
<meta name="theme-color" content="#2e2c2a">

<style>
:root {
  --stage: #1d1c1b;
  --chrome: #2e2c2a;
  --panel: #353331;
  --raised: #42403d;
  --input: #242322;
  --hover: #4b4845;
  --border: #1a1918;
  --line: #4a4744;
  --text: #dfdbd4;
  --dim: #a59f96;
  --faint: #7d7870;
  --accent: #e8a33d;
  --accent-ink: #1f1503;
  --danger: #e0614f;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Fraunces", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--stage); color: var(--text); font: 12px/1.3 var(--font); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
.boot { margin: auto; color: var(--dim); font: italic 500 22px var(--display); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.grow { flex: 1; }
.dim { color: var(--dim); }

.menubar { display: flex; align-items: center; height: 30px; background: var(--chrome); border-bottom: 1px solid var(--border); padding: 0 6px; flex: none; }
.brand { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 4px; font: italic 500 16px var(--display); color: var(--accent); }
.mark { width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, var(--accent) 0 50%, #8a5a1c 50% 100%); display: inline-block; }
.mark.big { width: 30px; height: 30px; border-radius: 6px; }
.mtitle { padding: 0 9px; height: 30px; line-height: 30px; border-radius: 3px; cursor: default; }
.mtitle:hover, .mtitle.open { background: var(--hover); }
.mobmenu, .dockbtn { display: none; width: 30px; height: 26px; align-items: center; justify-content: center; border-radius: 3px; }
.mobmenu:hover, .dockbtn:hover { background: var(--hover); }
.doctitle { color: var(--dim); padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }

.optbar { display: flex; align-items: center; gap: 12px; height: 36px; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 10px; flex: none; overflow-x: auto; overflow-y: hidden; white-space: nowrap; scrollbar-width: none; }
.optbar::-webkit-scrollbar { display: none; }
.oname { display: flex; align-items: center; gap: 6px; color: var(--dim); padding-right: 10px; border-right: 1px solid var(--line); height: 20px; flex: none; }
.opt { display: flex; align-items: center; gap: 5px; flex: none; color: var(--dim); }
.opt .unit { color: var(--faint); margin-left: -2px; }
.opt select { max-width: 170px; }

.main { flex: 1; display: flex; min-height: 0; }
.toolbar { width: 70px; background: var(--chrome); border-right: 1px solid var(--border); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-y: auto; flex: none; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.tgrid { display: grid; grid-template-columns: 30px 30px; gap: 2px; }
.tool { width: 30px; height: 28px; border-radius: 3px; display: flex; align-items: center; justify-content: center; color: var(--text); }
.tool:hover { background: var(--hover); }
.tool.on { background: var(--accent); color: var(--accent-ink); }
.swatches { position: relative; width: 52px; height: 52px; flex: none; }
.sw { position: absolute; width: 28px; height: 28px; border: 1px solid #000; box-shadow: 0 0 0 1px #d8d4cd; border-radius: 2px; }
.sw.fg { left: 2px; top: 2px; z-index: 1; }
.sw.bg { right: 2px; bottom: 2px; }
.mini { position: absolute; width: 14px; height: 14px; color: var(--dim); display: flex; align-items: center; justify-content: center; }
.mini.swap { right: 0; top: 0; }
.mini.reset { left: 0; bottom: 0; background: linear-gradient(135deg, #000 0 50%, #fff 50% 100%); border: 1px solid var(--dim); width: 11px; height: 11px; }

.center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; height: 26px; background: var(--chrome); border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-right: 1px solid var(--border); color: var(--dim); white-space: nowrap; cursor: default; }
.tab.on { background: var(--stage); color: var(--text); }
.tclose { width: 16px; height: 16px; border-radius: 3px; display: flex; align-items: center; justify-content: center; color: var(--dim); }
.tclose:hover { background: var(--hover); color: var(--text); }
.stagewrap { flex: 1; position: relative; min-height: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: var(--stage); }
.stage canvas { position: absolute; left: 0; top: 0; display: block; }
.stage .ov { pointer-events: none; }
.text-edit { position: absolute; margin: 0; padding: 0; border: 0; outline: 1px dashed var(--accent); outline-offset: 3px; background: transparent; resize: none; overflow: hidden; white-space: pre; transform-origin: 0 0; caret-color: var(--accent); user-select: text; -webkit-user-select: text; z-index: 3; }
.status { display: flex; align-items: center; gap: 14px; height: 24px; background: var(--chrome); border-top: 1px solid var(--border); padding: 0 8px; flex: none; white-space: nowrap; overflow: hidden; }
.zoomin { width: 58px; height: 18px; background: var(--input); border: 1px solid var(--border); border-radius: 2px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.hint { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }

.welcome { position: absolute; inset: 0; display: flex; overflow: auto; background: var(--stage); z-index: 4; padding: 24px 16px; }
.wbox { margin: auto; width: min(640px, 100%); display: flex; flex-direction: column; gap: 14px; }
.wtitle { display: flex; align-items: center; gap: 12px; font: italic 500 40px/1 var(--display); color: var(--text); }
.wsub { color: var(--dim); font-size: 14px; }
.wbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.wlabel { color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; margin-top: 10px; }
.wpresets { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.preset { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; }
.preset:hover { border-color: var(--accent); }
.preset b { font-weight: 500; }
.preset span { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.wtip { color: var(--faint); margin-top: 6px; }

.dock { width: 284px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex: none; min-height: 0; }
.panel { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
.panel.players { flex: 1; }
.phead { display: flex; height: 26px; background: var(--chrome); border-bottom: 1px solid var(--border); flex: none; }
.ptab { padding: 0 12px; height: 26px; line-height: 26px; color: var(--dim); border-right: 1px solid var(--border); }
.ptab.on { background: var(--panel); color: var(--text); }
.pbody { padding: 8px; overflow: auto; min-height: 0; }
.pbody.layers { padding: 0; display: flex; flex-direction: column; flex: 1; }
.pbody.hist { padding: 4px 0; flex: 1; }
.ctarget { display: flex; gap: 2px; margin-bottom: 6px; background: var(--input); border-radius: 3px; padding: 2px; }
.ctarget button { flex: 1; height: 20px; border-radius: 2px; color: var(--dim); }
.ctarget button.on { background: var(--raised); color: var(--text); }
.cw { display: flex; flex-direction: column; gap: 6px; }
.cw canvas { width: 100%; display: block; border-radius: 2px; cursor: crosshair; touch-action: none; }
.cw .sv { height: 120px; }
.cw .hue { height: 14px; }
.cfields { display: flex; align-items: center; gap: 4px; color: var(--dim); }
.cfields .num { width: 40px; }
.hexin { width: 64px; }
.swgrid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin-top: 8px; }
.swgrid button { aspect-ratio: 1; border: 1px solid var(--border); border-radius: 1px; }
.swgrid button:hover { outline: 1px solid var(--text); }

.lhead { display: flex; align-items: center; gap: 6px; padding: 6px 8px 0; flex: none; }
.lhead:nth-child(2) { padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.lhead .blend { flex: 1; min-width: 0; }
.lhead .num { width: 44px; }
.lhead .slider { flex: 1; }
.lbtn { width: 26px; height: 22px; border-radius: 3px; display: flex; align-items: center; justify-content: center; color: var(--text); }
.lbtn:hover { background: var(--hover); }
.lbtn.on { background: var(--accent); color: var(--accent-ink); }
.lbtn:disabled { opacity: 0.4; }
.llist { flex: 1; overflow-y: auto; min-height: 60px; }
.lrow { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px 0 0; border-bottom: 1px solid var(--border); cursor: default; }
.lrow.on { background: #57503f; }
.lrow.dtop { box-shadow: inset 0 2px 0 var(--accent); }
.lrow.dbot { box-shadow: inset 0 -2px 0 var(--accent); }
.eye { width: 28px; height: 44px; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border); color: var(--text); flex: none; }
.eye:hover { background: var(--hover); }
.thumb { width: 38px; height: 34px; background: repeating-conic-gradient(#fff 0 25%, #cfcfcf 0 50%) 0 0 / 10px 10px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; color: #222; }
.thumb canvas { max-width: 100%; max-height: 100%; display: block; }
.thumb.sel { outline: 2px solid var(--text); outline-offset: -1px; }
.maskthumb { background: #000; }
.maskthumb.offm { opacity: 0.4; outline: 1px solid var(--danger); }
.tT { font: 600 20px Georgia, serif; }
.clipmark { color: var(--dim); margin-right: -4px; display: flex; }
.lname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font: italic 600 11px Georgia, serif; color: var(--dim); cursor: pointer; }
.lfoot { display: flex; justify-content: flex-end; gap: 2px; padding: 4px 6px; border-top: 1px solid var(--border); flex: none; background: var(--chrome); }
.empty { padding: 16px; color: var(--faint); }
.hrow { padding: 4px 12px; cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow:hover { background: var(--hover); }
.hrow.on { background: #57503f; }
.hrow.future { color: var(--faint); font-style: italic; }

.num, .txt, select { height: 20px; background: var(--input); border: 1px solid var(--border); border-radius: 2px; padding: 0 4px; color: var(--text); }
.num { width: 52px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.num::-webkit-inner-spin-button, .num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
select { padding-right: 2px; }
input[type="checkbox"] { accent-color: var(--accent); margin: 0; width: 13px; height: 13px; }
.slider { -webkit-appearance: none; appearance: none; height: 16px; background: transparent; margin: 0; min-width: 60px; }
.slider.slim { width: 84px; }
.slider::-webkit-slider-runnable-track { height: 3px; background: var(--line); border-radius: 2px; }
.slider::-moz-range-track { height: 3px; background: var(--line); border-radius: 2px; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--text); margin-top: -4px; border: 1px solid var(--border); }
.slider::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--text); border: 1px solid var(--border); }
.swatchbtn { width: 30px; height: 20px; border: 1px solid #000; box-shadow: 0 0 0 1px var(--line); border-radius: 2px; }
.btn { height: 24px; padding: 0 12px; background: var(--raised); border: 1px solid var(--line); border-radius: 3px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { height: 22px; padding: 0 8px; }
.btn.big { height: 34px; padding: 0 18px; font-size: 13px; }

.menu { position: fixed; z-index: 50; min-width: 200px; background: var(--raised); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); padding: 4px 0; max-height: calc(100vh - 12px); overflow-y: auto; }
.item { display: flex; align-items: center; height: 24px; padding: 0 10px 0 4px; gap: 4px; cursor: default; white-space: nowrap; }
.item:hover, .item.hot { background: var(--accent); color: var(--accent-ink); }
.item.off { color: var(--faint); }
.item.off:hover { background: none; color: var(--faint); }
.item .chk { width: 16px; text-align: center; }
.item .lbl { flex: 1; padding-right: 24px; }
.item .key { opacity: 0.75; font-variant-numeric: tabular-nums; }
.sep { height: 1px; background: var(--line); margin: 4px 0; }

.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.45); display: flex; padding: 12px; }
.backdrop.clear { background: transparent; pointer-events: none; align-items: flex-start; justify-content: flex-end; padding: 80px 300px 0 0; }
.backdrop.clear .dialog { pointer-events: auto; margin: 0; }
.dialog { margin: auto; width: 380px; max-width: 100%; max-height: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; }
.dhead { height: 30px; line-height: 30px; padding: 0 12px; background: var(--chrome); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; font-weight: 600; cursor: move; touch-action: none; flex: none; }
.dbody { padding: 12px; overflow: auto; }
.dfoot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); flex: none; }
.form { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; min-height: 22px; }
.row .lab { width: 118px; color: var(--dim); flex: none; }
.row .slider { flex: 1; }
.row .txt, .row select { flex: 1; min-width: 0; }
.chkrow { margin-top: 4px; font-weight: 600; }
.note { color: var(--dim); margin-top: 8px; line-height: 1.5; }
.cpick { display: flex; gap: 12px; }
.cpick .cw { width: 220px; }
.ccompare { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--dim); }
.cnow { width: 60px; height: 34px; border: 1px solid #000; }
.help { line-height: 1.6; color: var(--text); user-select: text; -webkit-user-select: text; }
.help p { margin: 0 0 10px; color: var(--dim); }
.help b { display: block; color: var(--accent); margin-bottom: 2px; }

.toasts { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 60; pointer-events: none; }
.toast { background: #111; color: #f2efe9; border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; max-width: 80vw; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); transition: opacity 0.4s; }
.toast.out { opacity: 0; }
.busy { position: fixed; inset: 0; z-index: 70; display: flex; background: rgba(0, 0, 0, 0.25); cursor: progress; }
.busy div { margin: auto; background: #111; border: 1px solid var(--line); border-radius: 4px; padding: 10px 16px; }

body.nopanels .dock, body.nopanels .toolbar, body.nopanels .optbar { display: none; }

@media (max-width: 820px) {
  .mtitle { display: none; }
  .brand .bname { display: none; }
  .mobmenu, .dockbtn { display: flex; }
  .dock { position: fixed; top: 30px; right: 0; bottom: 0; z-index: 30; transform: translateX(100%); transition: transform 0.18s; box-shadow: -8px 0 24px rgba(0, 0, 0, 0.5); }
  .dock.show { transform: none; }
  .toolbar { width: 40px; }
  .tgrid { grid-template-columns: 30px; }
  .swatches { transform: scale(0.72); margin: -6px; }
  .backdrop.clear { padding: 70px 8px 0 0; }
  .status .dim { display: none; }
}
@media (pointer: coarse) {
  .tool { height: 34px; }
  .item { height: 34px; }
  .lrow { height: 50px; }
  .eye { height: 50px; }
}

</style>
</head>
